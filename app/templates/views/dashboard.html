<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoBalance</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../../static/style/styleMenu.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@1.1.7"></script>
</head>

<body>

    <div class="sidebar active">
        <div class="top">
            <div class="logo">
                <i class="bx bxl-codepen"></i>
                <span>EcoBalance</span>
            </div>
            <i class="bx bx-menu" id="btn"></i>
        </div>
        <div class="user">
            <img src="../static/images/images.jpg" alt="" class="user-img" />
            <div>
                <p class="bold">Hola</p>
                <p>{{session['name']}}</p>:
            </div>
        </div>
        <ul>
            <li>
                <a href="/ecobalance">
                    <i class='bx bxs-home-smile'></i>
                    <span class="nav-item">Inicio</span>
                </a>
                <!-- <span class="tooltip">Products</span> -->
            </li>

            <li>
                <a href="/historico">
                    <i class="bx bxs-grid-alt"></i>
                    <span class="nav-item">Tablero</span>
                </a>
                <!-- <span class="tooltip">Dashboard</span> -->
            </li>
            
            <li>
                <a href="#">
                    <i class="bx bx-list-check"></i>
                    <span class="nav-item">Categorias</span>
                </a>
                <!-- <span class="tooltip">Categories</span> -->
            </li>
            <li>
                <a href="#">
                    <i class="bx bxs-food-menu"></i>
                    <span class="nav-item">Ordenes</span>
                </a>
                <!-- <span class="tooltip">Orders</span> -->
            </li>
            <li>
                <a href="#">
                    <i class="bx bx-body"></i>
                    <span class="nav-item">Clientes</span>
                </a>
                <!-- <span class="tooltip">Customers</span> -->
            </li>
            <li>
                <a href="#">
                    <i class="bx bx-location-plus"></i>
                    <span class="nav-item">Envios</span>
                </a>
                <!-- <span class="tooltip">Shipping</span> -->
            </li>
            <li>
                <a href="#">
                    <i class="bx bx-cog"></i>
                    <span class="nav-item">Configuración</span>
                </a>
                <!-- <span class="tooltip">Settings</span> -->
            </li>
            <li>
                <a href="/logout">
                    <i class="bx bx-log-out"></i>
                    <span class="nav-item">Salir</span>
                </a>
                <!-- <span class="tooltip">Salir</span> -->
            </li>
        </ul>
    </div>

    <div class="main-content">
        <div class="container">
            <header>
                <div class="container">
                    <div class="header-content">
                        <div class="logoMenu-container">
                            <img src="../../static/images/Logo-Ecobalance.jpg" alt="Logo Ecobalance" class="logoMenu">
                        </div>
                        <div class="header-text">
                            <h1>Acumula Ecopuntos</h1>
                            <p>¡Gana puntos y obtén descuentos exclusivos!</p>
                        </div>
                    </div>
                </div>
            </header>

            <div class="chart-container">
                <div class="p-3 text-center">
                    <h5 class="chart-title">¡Historico de Ecopuntos!</h5>
                    <canvas id="allTemp" width="180" height="70"></canvas>
                </div>
            </div>

            <div class="charts-row">
                <div class="chart-container">
                    <div class="chart-content">
                        <h5 class="chart-title">¡Nuestro mayor logro!</h5>
                        <canvas id="maxPoint"></canvas>
                    </div>
                </div>
                <div class="chart-container">
                    <div class="chart-content">
                        <h5 class="chart-title">¡Seguimos creciendo!</h5>
                        <canvas id="minPoint"></canvas>
                    </div>
                </div>
            </div>
        </div>

    </div>
    </div>

    <script src="../../static/script/script.js"></script>
    <script src="../../static/script/dashboard.js"></script>

</body>

</html>
